name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Run unit tests
        run: make test

      - name: Build universal app bundle
        run: make build

      - name: Check the binary is universal
        run: lipo build/NerdStats.app/Contents/MacOS/NerdStats -verify_arch arm64 x86_64
